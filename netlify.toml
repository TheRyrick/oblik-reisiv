[build]
  publish = "build"
  # 1) автотести розрахунків — якщо хоч один падає, сайт НЕ оновлюється (лишається попередня версія);
  # 2) збирає стилі Tailwind, генерує js/env.js зі змінних SUPABASE_URL і SUPABASE_ANON_KEY і складає сайт у build/
  command = "npm test && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/js/env.js"
  [headers.values]
    Cache-Control = "no-cache"
