<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Генератор пароля — Облік рейсів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-200 sm:p-10">
  <div class="mx-auto max-w-xl rounded-2xl border border-white/10 bg-slate-900 p-6">
    <h1 class="mb-1 text-xl font-bold text-white">Зміна логіна та пароля</h1>
    <p class="mb-5 text-sm text-slate-400">Сторінка працює локально в браузері — пароль нікуди не надсилається.</p>
    <form id="f" class="grid gap-3">
      <input id="u" class="rounded-lg border border-white/10 bg-slate-800 px-3 py-2" placeholder="Логін" value="admin" autocomplete="off" />
      <input id="p" type="password" class="rounded-lg border border-white/10 bg-slate-800 px-3 py-2" placeholder="Новий пароль (мін. 10 символів)" autocomplete="new-password" />
      <input id="p2" type="password" class="rounded-lg border border-white/10 bg-slate-800 px-3 py-2" placeholder="Повторіть пароль" autocomplete="new-password" />
      <p id="e" class="hidden text-sm text-rose-300"></p>
      <button class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-500">Згенерувати</button>
    </form>
    <div id="out" class="mt-6 hidden">
      <p class="mb-2 text-sm text-slate-300">Замініть увесь вміст файлу <code class="text-emerald-300">js/auth-config.js</code> цим текстом:</p>
      <textarea id="code" readonly rows="11" class="w-full rounded-lg border border-white/10 bg-black/40 p-3 font-mono text-xs text-emerald-200"></textarea>
      <button id="copy" class="mt-2 rounded-lg bg-white/10 px-3 py-1.5 text-sm hover:bg-white/20">Копіювати</button>
    </div>
  </div>
  <script>
    const hex = (buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const e = document.getElementById('e');
      const u = document.getElementById('u').value.trim();
      const p = document.getElementById('p').value;
      const fail = (m) => { e.textContent = m; e.classList.remove('hidden'); };
      e.classList.add('hidden');
      if (!u) return fail('Введіть логін.');
      if (p.length < 10) return fail('Пароль має містити щонайменше 10 символів.');
      if (p !== document.getElementById('p2').value) return fail('Паролі не збігаються.');
      const iterations = 210000;
      const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveBits']);
      const hash = hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations }, key, 256));
      document.getElementById('code').value =
`/*
 * Дані для входу. Пароль тут НЕ зберігається у відкритому вигляді —
 * лише його хеш (PBKDF2-SHA256). Щоб змінити логін/пароль, відкрийте
 * tools/password.html, згенеруйте новий блок і вставте його сюди.
 */
window.AUTH_CONFIG = {
  username: ${JSON.stringify(u)},
  salt: '${salt}',
  iterations: ${iterations},
  hash: '${hash}',
  rememberDays: 30,
};
`;
      document.getElementById('out').classList.remove('hidden');
    });
    document.getElementById('copy').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('code').value);
    });
  </script>
</body>
</html>
